openapi: 3.1.0
info:
  title: 智能物业管理系统 API
  version: 1.0.0
  description: 第一阶段会话、权限、地市、用户与仪表盘契约。
servers:
  - url: /
paths:
  /api/v1/sessions:
    post:
      operationId: createSession
      summary: 建立服务端会话
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "201":
          description: 会话已建立
          headers:
            Location:
              schema:
                type: string
              description: 固定为 /api/v1/sessions/current
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "422":
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/sessions/current:
    get:
      operationId: getCurrentSession
      summary: 查询当前会话
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 当前会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
    delete:
      operationId: deleteCurrentSession
      summary: 注销当前会话
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        "204":
          description: 会话已注销
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/cities:
    get:
      operationId: listCities
      summary: 查询江苏省地市字典
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 13 个地市，按展示顺序返回
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/City"
        "401":
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/users:
    get:
      operationId: listUsers
      summary: 查询账号分页列表（仅超级管理员）
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 用户分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "422":
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/dashboard/summary:
    get:
      operationId: getDashboardSummary
      summary: 查询当前账号数据范围内的仪表盘概览
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 仪表盘概览
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/ProblemResponse"
  /actuator/health:
    get:
      operationId: health
      summary: 进程健康检查
      security: []
      responses:
        "200":
          description: 服务健康
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: UP
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: THREE_FEES_SESSION
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
  responses:
    ProblemResponse:
      description: RFC 9457 错误
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_]+$"
        password:
          type: string
          minLength: 1
          maxLength: 72
          writeOnly: true
    City:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
        name:
          type: string
    User:
      type: object
      additionalProperties: false
      required: [id, username, displayName, roles, city, mustChangePassword]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [SUPER_ADMIN, CITY_USER]
        city:
          oneOf:
            - $ref: "#/components/schemas/City"
            - type: "null"
        mustChangePassword:
          type: boolean
    SessionResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    UserPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    DashboardSummary:
      type: object
      additionalProperties: false
      required:
        - currentDataPeriod
        - cityCount
        - billingPointCount
        - overLimitBillingPointCount
        - draftReportCount
      properties:
        currentDataPeriod:
          type: [string, "null"]
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        cityCount:
          type: integer
          minimum: 0
        billingPointCount:
          type: integer
          minimum: 0
        overLimitBillingPointCount:
          type: integer
          minimum: 0
        draftReportCount:
          type: integer
          minimum: 0
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    Problem:
      type: object
      required: [type, title, status, detail, instance, code, traceId, fieldErrors]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        traceId:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
