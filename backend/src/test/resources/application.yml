spring:
  datasource:
    url: jdbc:h2:mem:threefees;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
      table-name: spring_session

server:
  servlet:
    session:
      cookie:
        secure: false

logging:
  level:
    root: WARN
