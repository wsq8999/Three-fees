spring:
  ai:
    model:
      chat: openai
    openai:
      api-key: test-key-not-used
      base-url: https://api.moonshot.cn/v1
      chat:
        options:
          model: kimi-k3
  datasource:
    # 每个 Spring 测试上下文使用独立内存库，避免首批账号密码和业务数据互相污染。
    url: jdbc:h2:mem:threefees-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
      table-name: spring_session

server:
  servlet:
    session:
      cookie:
        secure: false

logging:
  level:
    root: WARN
