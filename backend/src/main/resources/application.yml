spring:
  application:
    name: three-fees-api
  ai:
    model:
      chat: openai
    openai:
      base-url: ${KIMI_BASE_URL:https://api.moonshot.cn/v1}
      api-key: ${KIMI_API_KEY:not-configured-placeholder}
      chat:
        model: ${KIMI_MODEL:kimi-k3}
        options:
          reasoning-effort: ${KIMI_REASONING_EFFORT:low}
          max-completion-tokens: ${KIMI_MAX_COMPLETION_TOKENS:8192}
          timeout: ${KIMI_REQUEST_TIMEOUT:10m}
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/three_fees?characterEncoding=utf8&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true&sslMode=DISABLED}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: spring_session
  jackson:
    default-property-inclusion: always

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 10

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: THREE_FEES_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

app:
  bootstrap:
    enabled: ${INITIAL_ACCOUNT_BOOTSTRAP_ENABLED:false}
    initial-password: ${INITIAL_ACCOUNT_PASSWORD:}
  file:
    root: ${APP_FILE_ROOT:runtime/files}
    max-import-rows: 200000
  worker:
    poll-delay: 500
    lease-seconds: 30
  ai:
    enabled: ${AI_ENABLED:false}
    model: ${KIMI_MODEL:kimi-k3}
    max-history-cases: ${AI_MAX_HISTORY_CASES:30}
    max-cross-city-cases: ${AI_MAX_CROSS_CITY_CASES:5}
  report:
    font-path: ${REPORT_FONT_PATH:}

three-fees:
  process-role: ${THREE_FEES_PROCESS_ROLE:all}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p traceId=%X{traceId:-none}"
