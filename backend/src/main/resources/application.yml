spring:
  application:
    name: three-fees-api
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/three_fees?characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=DISABLED}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: spring_session
  jackson:
    default-property-inclusion: always

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 10

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: THREE_FEES_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

app:
  bootstrap:
    enabled: ${INITIAL_ACCOUNT_BOOTSTRAP_ENABLED:false}
    initial-password: ${INITIAL_ACCOUNT_PASSWORD:}
  file:
    root: ${APP_FILE_ROOT:}
    max-upload-bytes: 104857600
    max-import-rows: 200000
    max-image-bytes: 10485760
    max-image-pixels: 40000000
  worker:
    poll-delay: 500
    lease-seconds: 30
  ai:
    enabled: ${AI_SERVICE_ENABLED:false}
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8100}
    token: ${AI_SERVICE_TOKEN:}
    timeout-seconds: 30
  report:
    font-path: ${REPORT_FONT_PATH:}

three-fees:
  process-role: ${THREE_FEES_PROCESS_ROLE:api}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p traceId=%X{traceId:-none}"
