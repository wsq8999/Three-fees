[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "three-fees-ai-service"
version = "0.1.0"
description = "Stateless internal AI capability sidecar"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "uvicorn==0.41.0",
]

[project.optional-dependencies]
dev = [
  "jsonschema==4.26.0",
  "pytest==9.0.2",
  "ruff==0.15.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
allowed-confusables = ["，", "；", "：", "（", "）"]
